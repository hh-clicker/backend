databaseChangeLog:
  - changeSet:
      id: 025-telegram-attention-messages
      author: hh-clicker
      changes:
        - sql:
            sql: |
              create table telegram_attention_message (
                attention_id uuid not null references application_item(id) on delete cascade,
                bot_id bigint not null,
                chat_id bigint not null,
                message_id bigint not null,
                fingerprint varchar(200) not null,
                closed boolean not null default false,
                created_at timestamp with time zone not null default now(),
                updated_at timestamp with time zone not null default now(),
                primary key (attention_id, bot_id, chat_id),
                unique (bot_id, chat_id, message_id)
              );
